<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎯 Interview Assistant</h1>
      <p class="subtitle">Your AI-powered interview companion</p>
    </header>

    <div class="controls">
      <button id="selectSource" class="btn btn-primary">
        📺 Select Screen/Window
      </button>
      <button id="startCapture" class="btn btn-success" disabled>
        ▶️ Start Monitoring
      </button>
      <button id="stopCapture" class="btn btn-danger" disabled>
        ⏹️ Stop
      </button>
    </div>

    <div class="status">
      <div class="status-indicator" id="statusIndicator">
        <span class="dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </div>

    <div class="section">
      <h3>📝 Detected Content</h3>
      <div id="capturedText" class="text-box">
        No content captured yet. Select a source and start monitoring.
      </div>
    </div>

    <div class="section">
      <h3>💡 AI Suggestions</h3>
      <div id="suggestions" class="suggestions-box">
        <p class="placeholder">AI suggestions will appear here...</p>
      </div>
    </div>

    <div class="section">
      <h3>⚙️ Options</h3>
      <label class="checkbox-label">
        <input type="checkbox" id="autoRefresh" checked>
        Auto-refresh every 3 seconds
      </label>
    </div>
  </div>

  <!-- Source Selection Modal -->
  <div id="sourceModal" class="modal">
    <div class="modal-content">
      <h2>Select Screen or Window</h2>
      <div id="sourceList" class="source-list"></div>
      <button id="closeModal" class="btn">Cancel</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
